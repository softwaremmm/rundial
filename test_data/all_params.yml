parameters:
  # These apply to all rows
  min_depth: 5
  min_hq_depth: 2 # min depth of high-quality base calls
  min_strand_bias: 0.10 # Need at least this proportion of reads on each strand
  min_mq: 30 # min mapping quality
  het_threshold: 0.35 # Proportion of reads supporting second allele to call het.
  strand_mismatch_threshold: 2
  # A strand mismatch is when +strand supports one allele, and -strange a different allele.

ref_parameters:
  # These apply only to non-indel homogenous reference calls
  min_frs: 0.80 # min fraction of reads supporting variant
  min_qual: 20 # minimum QUAL value required

snp_parameters:
  # These apply only for snp calls based on genotype (so GT!=0/0). Het flagged calls also get checked
  min_qual: 25
  min_vdb: 0.00001 # This is the variant distance bias, it flags varants that appear in the same place in all reads, and so are likely an artifact
  min_frs: 0.80 # min fraction of reads supporting variant

indel_parameters:
  # These apply only to indels
  min_hq_depth: 5
  min_qual: 50
  min_idv: 5 # min number of reads supporting an indel
  min_imf: 0.60 # min fraction of reads supporting an indel as bcftools calculates
  min_frs: 0.65 # min fraction of reads supporting variant

fix_gt: true # If true, will fix GT field to match AD field
