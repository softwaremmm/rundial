skip_indels: False
mask_missing_sites: True # Sites not in the input vcfs are set to N

use_filters: True
filter_ignore_list:
  - "RefCall"

# Minimum support for considering an allele a minor allele
minor_pop_thresholds:
  threshold: 5
  strand_bias: 0.01

remove_sub_minor_pops: True
call_snps_in_support: False
remove_minor_pops_in_support: False

main_caller: "bcftools"
