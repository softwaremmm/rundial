parameters:
  # These apply to all rows
  MIN_DP: 5
  MIN_HQ_DP: 3 # min depth of high-quality base calls
  MIN_QUAL: 20 # minimum QUAL value required
  MIN_MQ: 30 # min mapping quality
  STRAND_MISMATCH: 2
  # A strand mismatch is when +strand supports one allele, and -strange a different allele.
  # A strand is considered to support an allele if the allele has within X reads of the top allele.
  # So ADF=2,10,8 would support allele 1 and 2, but not 0 (assuming threshold of 2)


# These apply only to indels
indel_parameters:
  MIN_IDV: 5 # min number of reads supporting an indel
  MIN_FRS: 0.60 # min fraction of reads supporting variant
  STRAND_BIAS: 2 # Need at least this percentage of reads on each strand

# These apply only for snp calls based on genotype (so GT!=0/0).
snp_parameters:
  MIN_VDB: 0.00001 # This is the variant distance bias, it flags varants that appear in the same place in all reads, and so are likely an artifact
  MIN_FRS: 0.90 # min fraction of reads supporting variant
  STRAND_BIAS: 2 # Need at least this percentage of reads on each strand

# The rest also get these parameters
ref_parameters:
  MIN_FRS: 0.90 # min fraction of reads supporting variant

fix_gt: true # If true, will fix GT field to match AD field
