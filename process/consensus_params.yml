skip_indels: False
mask_missing_sites: True # Sites not in the input vcfs are set to N

use_filters: True # Filtered sites are replaced with F
filter_ignore_list:
  - "RefCall"

# Detecting minor populations just ensures those vcf rows our output for downstream processing.
# Threshold is min number of reads for an allele to be considered a minor population
minor_pop_threshold: 3

# Het options are "Ref", "Alt", "Best" (which will select the major allele), or "Mask" to replace with Z
het_snp_option: "Mask"
het_indel_option: "Mask"

main_caller: "bcftools"
