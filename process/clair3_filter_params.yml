# These apply to all
parameters:
  MIN_DP: 5
  MIN_HQ_DP: 5 # min depth using the COV sum
  MIN_QUAL: 2 # based on QUAL column

# If indel add these as well
indel_parameters:
  # These apply only to indels
  MIN_FRS: 0.60

# else if a snp (GT != 0/0) add these
snp_parameters:
  # These apply only for snp calls based on genotype (so GT!=0/0).
  MIN_FRS: 0.90

# else add these
ref_parameters:
  MIN_AF: 0.90 # compares allelic depth to total depth

fix_gt: true # If true, will fix GT field to match AD field
